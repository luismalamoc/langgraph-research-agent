services:
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    container_name: langgraph-research-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    platform: linux/arm64
    container_name: langgraph-research-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_PROVIDER=ollama
    volumes:
      - ./app:/app/app:ro
      - reports_data:/tmp/reports
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
  reports_data:
