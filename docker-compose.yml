services:
  ollama:
    image: ollama/ollama:latest
    container_name: langgraph-research-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: langgraph-research-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./app:/app/app:ro
      - reports_data:/tmp/reports
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  reports_data:
