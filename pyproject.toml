[project]
name = "langgraph-research-agent"
version = "0.1.0"
description = "LangGraph Research Agent — local research agent with Ollama"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-ollama>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
